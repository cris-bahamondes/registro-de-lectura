<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Open Book Line Art Icon matching libro-abierto.png exactly -->
  <g fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Cover Outer Path -->
    <path d="M220 162 L106 72 C106 72 40 100 20 115 L20 380 C40 395 216 486 216 486 L216 162 Z" fill="#FFFFFF" />
    
    <!-- Right Cover Outer Path -->
    <path d="M292 162 L406 72 C406 72 472 100 492 115 L492 380 C472 395 296 486 296 486 L296 162 Z" fill="#FFFFFF" />

    <!-- Center Spine -->
    <rect x="220" y="162" width="72" height="324" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="16"/>
    <!-- Spine top and bottom bands -->
    <line x1="220" y1="202" x2="292" y2="202" stroke="#000000" stroke-width="16"/>
    <line x1="220" y1="236" x2="292" y2="236" stroke="#000000" stroke-width="16"/>
    <line x1="220" y1="438" x2="292" y2="438" stroke="#000000" stroke-width="16"/>
    <line x1="220" y1="468" x2="292" y2="468" stroke="#000000" stroke-width="16"/>
    <!-- Spine Center Vertical Pill Accent -->
    <rect x="248" y="278" width="16" height="104" rx="8" fill="#000000" stroke="none"/>

    <!-- Left Book Pages Curves (Top) -->
    <path d="M220 162 C160 100 110 50 106 50 C106 50 106 100 106 100" />
    <path d="M220 162 C180 80 145 58 145 58" />
    <path d="M256 162 C236 70 216 20 216 20 C216 20 206 56 206 90" />
    <line x1="180" y1="80" x2="204" y2="108" stroke-width="14"/>

    <!-- Right Book Pages Curves (Top) -->
    <path d="M292 162 C352 100 402 50 406 50 C406 50 406 100 406 100" />
    <path d="M292 162 C332 80 367 58 367 58" />
    <path d="M256 162 C276 70 296 20 296 20 C296 20 306 56 306 90" />
